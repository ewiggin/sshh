# Gruvbox (dark) for sshh.
# Palette by Pavel Pertsev (morhetz): https://github.com/morhetz/gruvbox (MIT).

background = "#282828"
foreground = "#ebdbb2"
# The 16 ANSI colors: black, red, green, yellow, blue, magenta, cyan, white,
# then their bright versions.
palette = [
  "#282828", "#cc241d", "#98971a", "#d79921", "#458588", "#b16286", "#689d6a", "#a89984",
  "#928374", "#fb4934", "#b8bb26", "#fabd2f", "#83a598", "#d3869b", "#8ec07c", "#ebdbb2",
]

# Colors of sshh itself; each one defaults to its ANSI color of the palette
# (accent = blue, match = yellow, tag = magenta, connected = green,
# danger = red).
[ui]
accent = "#83a598"
