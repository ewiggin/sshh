[package]
# The crate name `sshh` is taken on crates.io; the binary is still `sshh`.
name = "sshh-tui"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "SSH connection manager with a TUI: use it like ssh, save connections with notes and tags, and keep several sessions open side by side"
authors = ["Mario Martinez"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ewiggin/sshh"
readme = "README.md"
keywords = ["ssh", "tui", "terminal", "connection-manager", "cli"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/scripts", "/install.sh", "/CLAUDE.md", "/dist"]

[[bin]]
name = "sshh"
path = "src/main.rs"

# `cargo binstall sshh-tui` downloads the release tarball instead of building
# (on linux-gnu it also tries the musl targets, which are the ones published).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sshh-{ target }.tar.gz"
bin-dir = "sshh-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
libc = "0.2.190"
nucleo-matcher = "0.3.1"
portable-pty = "0.9"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tui-term = "0.3.4"
vt100 = "0.16"

[profile.release]
# Smaller binaries (~1 MB less); panics still report the message and location.
strip = true
